name: GIDEON Windows release

on:
  push:
    branches: ['main']
    tags: ['v*']
    paths-ignore: ['docs/**', 'README.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gideon-release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          cache: npm
      - run: npm ci --no-fund --no-audit
      - run: npm test
      - run: npm run test:integration

  windows:
    needs: checks
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Check release version
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'The tag must match desktop/package.json.'
          }
      - run: npm ci --no-fund --no-audit
      - name: Prepare signed Windows runtime
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          node scripts/build-desktop.mjs --prepare-only 2>&1 | Tee-Object -FilePath windows-build.log
          $buildExit = $LASTEXITCODE
          if ($buildExit -ne 0) {
            $tail = (Get-Content windows-build.log -Tail 35) -join "`n"
            $message = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows packaging::$message"
            exit $buildExit
          }
      - name: Verify native Windows engine
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          node scripts/verify-desktop-windows.mjs .desktop-build 2>&1 | Tee-Object -FilePath windows-engine.log
          $engineExit = $LASTEXITCODE
          if ($engineExit -ne 0) {
            $tail = (Get-Content windows-engine.log -Tail 35) -join "`n"
            $message = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows engine::$message"
            exit $engineExit
          }
      - name: Verify native Windows PDF and document creation
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          node scripts/verify-documents-windows.mjs .desktop-build 2>&1 | Tee-Object -FilePath windows-documents.log
          $documentsExit = $LASTEXITCODE
          if ($documentsExit -ne 0) {
            $tail = (Get-Content windows-documents.log -Tail 35) -join "`n"
            $message = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows documents::$message"
            exit $documentsExit
          }
      - name: Package verified Windows app
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          node scripts/build-desktop.mjs --package-only --installer-only 2>&1 | Tee-Object -FilePath windows-package.log
          $packageExit = $LASTEXITCODE
          if ($packageExit -ne 0) {
            $tail = (Get-Content windows-package.log -Tail 35) -join "`n"
            $message = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows packaging::$message"
            exit $packageExit
          }
      - name: Verify real Windows desktop and encrypted key storage
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          node scripts/verify-desktop-launch-windows.mjs dist/desktop/win-unpacked/GIDEON.exe 2>&1 | Tee-Object -FilePath windows-ui.log
          $uiExit = $LASTEXITCODE
          if ($uiExit -ne 0) {
            $tail = (Get-Content windows-ui.log -Tail 35) -join "`n"
            $message = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows desktop::$message"
            exit $uiExit
          }
      - name: Verify Windows upgrade, retained memory and installed desktop launch
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          node scripts/verify-desktop-installer-windows.mjs "dist/desktop/GIDEON-$version-Kurulum.exe" 2>&1 | Tee-Object -FilePath windows-installer.log
          $installerExit = $LASTEXITCODE
          if ($installerExit -ne 0) {
            $tail = (Get-Content windows-installer.log -Tail 35) -join "`n"
            $message = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows installation::$message"
            exit $installerExit
          }
      - name: Publish verified Windows installer
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content desktop/package.json -Raw | ConvertFrom-Json).version
          $assets = @("dist/desktop/GIDEON-$version-Kurulum.exe", 'dist/desktop/SHA256SUMS.txt', 'dist/desktop/PACKAGED-SOURCES.json')
          gh release view "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            throw 'Release already exists; refusing to overwrite published binaries.'
          }
          gh release create "$env:GITHUB_REF_NAME" @assets --repo "$env:GITHUB_REPOSITORY" --verify-tag --title "GIDEON $version — Windows" --notes-file "docs/RELEASE-$version.md"
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
